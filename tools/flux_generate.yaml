identity:
  name: flux_generate_image
  author: acedatacloud
  label:
    en_US: Flux Generate Image
    zh_Hans: Flux 生成图片
description:
  human:
    en_US: Generate images with Ace Data Cloud Flux Images Generation API.
    zh_Hans: 通过 Ace Data Cloud Flux Images Generation API 生成图片。
  llm: Generate images from prompt via Ace Data Cloud Flux Images Generation API.
    Generation returns a task ID. Query the same task until complete; never resubmit
    a pending generation.
parameters:
- name: size
  type: string
  required: false
  label:
    en_US: Size
    zh_Hans: 尺寸
  human_description:
    en_US: Optional output size (e.g., 1024x1024).
    zh_Hans: 可选输出尺寸（例如 1024x1024）。
  llm_description: Optional output size (e.g., 1024x1024).
  form: form
  default: 1024x1024
- name: count
  type: number
  required: false
  label:
    en_US: Count
    zh_Hans: 数量
  human_description:
    en_US: Optional number of images to generate. Default is 1.
    zh_Hans: 可选生成图片数量，默认 1。
  llm_description: Optional number of images to generate. Default is 1.
  form: form
  default: 1
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select the current API model for this operation.
    zh_Hans: 用于生成图像的模型。
  llm_description: Select the current API model for this operation.
  form: form
  default: flux-dev
  options:
  - value: flux-dev
    label:
      en_US: flux-dev
      zh_Hans: flux-dev
  - value: flux-pro
    label:
      en_US: flux-pro
      zh_Hans: flux-pro
  - value: flux-kontext-pro
    label:
      en_US: flux-kontext-pro
      zh_Hans: flux-kontext-pro
  - value: flux-kontext-max
    label:
      en_US: flux-kontext-max
      zh_Hans: flux-kontext-max
  - value: flux-2-flex
    label:
      en_US: flux-2-flex
      zh_Hans: flux-2-flex
  - value: flux-2-pro
    label:
      en_US: flux-2-pro
      zh_Hans: flux-2-pro
  - value: flux-2-max
    label:
      en_US: flux-2-max
      zh_Hans: flux-2-max
  - value: flux-2-klein
    label:
      en_US: flux-2-klein
      zh_Hans: flux-2-klein
- name: action
  type: select
  required: true
  label:
    en_US: Action
    zh_Hans: 操作
  human_description:
    en_US: Set action.
    zh_Hans: 生成图像的操作类型。若为 `generate`，将根据提示词生成新图像；若为 `edit`，将根据提示词和 `image_url` 对原图进行编辑。
  llm_description: Set action.
  form: form
  options:
  - value: generate
    label:
      en_US: generate
      zh_Hans: generate
  - value: edit
    label:
      en_US: edit
      zh_Hans: edit
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Text prompt used to generate the images.
    zh_Hans: 用于生成图片的提示词。
  llm_description: Text prompt used to generate the images.
  form: llm
- name: image_url
  type: string
  required: false
  label:
    en_US: Image Url
    zh_Hans: 图片链接
  human_description:
    en_US: Set image url.
    zh_Hans: 需要进行编辑的原始图像链接。
  llm_description: Set image url.
  form: form
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/flux_generate.py
